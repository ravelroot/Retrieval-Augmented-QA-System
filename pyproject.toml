[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "nexo"
version = "2.0.1"
description = "Chatbot RAG que responde dúvidas com base estrita em manuais técnicos e livros em PDF."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"

[tool.setuptools.packages.find]
include = ["nexo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
