services:
  nexo:
    build: .
    image: nexo:2.3.0
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      NEXO_HOST: 0.0.0.0
      NEXO_PORT: "8000"
      NEXO_DATA_DIR: /dados
      NEXO_OLLAMA_URL: http://ollama:11434
    volumes:
      - nexo-dados:/dados
    restart: unless-stopped
    profiles: ["app"]

  chroma:
    image: chromadb/chroma:latest
    ports:
      - "8001:8000"
    volumes:
      - chroma-dados:/data
    profiles: ["chroma"]

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant-dados:/qdrant/storage
    profiles: ["qdrant"]

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-dados:/root/.ollama
    profiles: ["ollama"]

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: nexo
      POSTGRES_USER: nexo
      POSTGRES_PASSWORD: troque-esta-senha
    ports:
      - "5432:5432"
    volumes:
      - postgres-dados:/var/lib/postgresql/data
    profiles: ["postgres"]

volumes:
  nexo-dados:
  chroma-dados:
  qdrant-dados:
  ollama-dados:
  postgres-dados:
