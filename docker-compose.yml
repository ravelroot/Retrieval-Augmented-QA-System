services:
  chroma:
    image: chromadb/chroma:latest
    ports:
      - "8001:8000"
    volumes:
      - chroma-dados:/data
    profiles: ["chroma"]

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant-dados:/qdrant/storage
    profiles: ["qdrant"]

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-dados:/root/.ollama
    profiles: ["ollama"]

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: nexo
      POSTGRES_USER: nexo
      POSTGRES_PASSWORD: troque-esta-senha
    ports:
      - "5432:5432"
    volumes:
      - postgres-dados:/var/lib/postgresql/data
    profiles: ["postgres"]

volumes:
  chroma-dados:
  qdrant-dados:
  ollama-dados:
  postgres-dados:
